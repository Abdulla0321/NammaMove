# Local development gateway only. No API key or signing secret belongs here.
map $http_origin $nammamove_preview_origin {
    default "";
    "http://localhost:8081" $http_origin;
    "http://127.0.0.1:8081" $http_origin;
}

server {
    listen 80;
    location /auth/v1/ {
        # Older local GoTrue CORS does not accept the browser client's apikey
        # header. Handle preflight here, with exact preview origins.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Access-Control-Allow-Origin $nammamove_preview_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version" always;
        add_header Vary "Origin" always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://auth:9999/;
        proxy_set_header Host $http_host;
    }
}
