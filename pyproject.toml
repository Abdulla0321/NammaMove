[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
markers = ["otp: requires a real OTP service and sealed synthetic fixture graph", "postgres: requires a disposable PostgreSQL/PostGIS *_test database", "supabase: requires genuine local Supabase Auth and a non-owner PostgreSQL login"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]
strict = true
