services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nammamove
      POSTGRES_USER: nammamove
      POSTGRES_PASSWORD: localdev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pgdata:
